<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hello Kitty Island Adventure</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Baloo+2:wght@600&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #C4E1E6;
            color: #978c88;
        }

        /* ===== HEADER ===== */
        header {
            background: #A4CCD9;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header img {
            height: 50px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .main-content {
            padding: 90px 20px;
            display: flex;
            justify-content: center;
        }

        .content-box {
            background: linear-gradient(135deg, #8CCDEB, #F1E6EB);
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h2 {
            font-family: 'Baloo 2', cursive;
            color: #3f555a;
            margin-bottom: 30px;
        }

        /* ===== JAM ===== */
        .digital-clock {
            font-size: 60px;
            letter-spacing: 5px;
            padding: 25px 60px;
            border-radius: 50px;
            background: #7da7c7;
            color: #e9f6ff;
            display: inline-block;
            margin-bottom: 40px;
        }

        /* ===== FORM ===== */
        .form-control, .form-select {
            border-radius: 15px;
        }

        .btn-custom {
            background: #7da7c7;
            color: white;
            border-radius: 20px;
            padding: 10px 30px;
        }

        .btn-custom:hover {
            background: #5f8fb3;
        }

        /* ===== FOOTER ===== */
        footer {
            background: #abb7ca;
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .digital-clock {
                font-size: 42px;
                padding: 18px 35px;
            }
        }
    </style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
    <img src="ft.png" alt="Logo">
    <nav>
        <a href="index.html"><font color="white">HOME</font></a> |
        <a href="characters.html"><font color="white">CHARACTERS</font></a> |
        <a href="updates.html"><font color="white">UPDATES</font></a> |
        <a href="contact.html"><font color="white">CONTACT</font></a> |

    </nav>
</header>

<!-- ===== CONTENT ===== -->
<section class="main-content">
    <div class="content-box">

        <h2>Digital Clock & Payment Form</h2>

        <div id="digitalClock" class="digital-clock">00:00:00</div>

        <hr class="my-5">

        <h2>Pembayaran</h2>

        <form class="text-start">
            <div class="mb-3">
                <label class="form-label">Nama</label>
                <input type="text" class="form-control" placeholder="Masukkan nama Anda">
            </div>

            <div class="mb-3">
                <label class="form-label">No Telepon</label>
                <input type="text" class="form-control" placeholder="08xxxxxxxx">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <textarea class="form-control" rows="3" placeholder="Masukkan email Anda"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Metode Pembayaran</label>
                <select class="form-select">
                    <option selected>Pilih Pembayaran</option>
                    <option>BNI</option>
                    <option>BCA</option>
                    <option>BRI</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Bermain</label><br>
                <input type="radio" name="bed"> Steam
                <br>
                <input type="radio" name="bed"> Nintendo Switch
                <br>
                <input type="radio" name="bed"> PlayStation
                <br>
                <input type="radio" name="bed"> Apple Arcade <br>

            </div>

            <div class="mb-4">
                <label class="form-label">Tanggal Pembelian</label>
                <input type="date" class="form-control">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-custom me-2">Kirim</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
        </form>

    </div>
</section>

<!-- ===== FOOTER ===== -->
<footer>
    &copy; CopyRight [Ashika Nur Shafana, 251011701024] - 2026
</footer>

<!-- ===== JS JAM ===== -->
<script>
    const clock = document.getElementById("digitalClock");

    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        clock.textContent = `${h}:${m}:${s}`;
    }

    setInterval(updateClock, 1000);
    updateClock();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
